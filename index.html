<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>En Archē</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --vellum: #F9F6EE;
    --vellum-deep: #F1ECDE;
    --surface: #FFFFFF;
    --ink: #2A2419;
    --ink-soft: #6B6252;
    --line: #DDD5C2;
    --lapis: #33549E;
    --lapis-ink: #FFFFFF;
    --lapis-wash: #E9EDF7;
    --gold: #A9802D;
    --gold-wash: #F5EDDA;
    --rubric: #A63A2B;
    --rubric-wash: #F7E7E3;
    --moss: #4A7A52;
    --moss-wash: #E7F0E8;
    --shadow: 0 1px 3px rgba(42, 36, 25, 0.08), 0 4px 14px rgba(42, 36, 25, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --vellum: #1D1912;
      --vellum-deep: #16130D;
      --surface: #262117;
      --ink: #EAE2CE;
      --ink-soft: #A79B82;
      --line: #3B3427;
      --lapis: #8AA6E8;
      --lapis-ink: #16130D;
      --lapis-wash: #262C3D;
      --gold: #D2A94F;
      --gold-wash: #322A1A;
      --rubric: #D07A65;
      --rubric-wash: #3A241F;
      --moss: #7FAF83;
      --moss-wash: #22301F;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --vellum: #1D1912;
    --vellum-deep: #16130D;
    --surface: #262117;
    --ink: #EAE2CE;
    --ink-soft: #A79B82;
    --line: #3B3427;
    --lapis: #8AA6E8;
    --lapis-ink: #16130D;
    --lapis-wash: #262C3D;
    --gold: #D2A94F;
    --gold-wash: #322A1A;
    --rubric: #D07A65;
    --rubric-wash: #3A241F;
    --moss: #7FAF83;
    --moss-wash: #22301F;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--vellum);
    color: var(--ink);
    font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  .greek, .gk {
    font-family: "Cardo", "Palatino Linotype", "Times New Roman", serif;
  }
  h1, h2, h3 {
    font-family: "Cardo", "Palatino Linotype", Georgia, serif;
    line-height: 1.2;
    text-wrap: balance;
    margin: 0;
  }

  /* ---------- shell ---------- */
  header.bar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--vellum);
    border-bottom: 1px solid var(--line);
  }
  .bar-inner {
    max-width: 780px;
    margin: 0 auto;
    padding: 0.65rem 1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .wordmark {
    font-family: "Cardo", Georgia, serif;
    font-weight: 700;
    font-size: 1.2rem;
    letter-spacing: 0.02em;
    color: var(--ink);
    white-space: nowrap;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
  }
  .wordmark .gk-mark { color: var(--lapis); }
  nav.tabs {
    display: flex;
    gap: 0.25rem;
    margin-left: auto;
  }
  .tab {
    font: inherit;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--ink-soft);
    background: none;
    border: none;
    border-radius: 999px;
    padding: 0.35rem 0.85rem;
    cursor: pointer;
  }
  .tab:hover { color: var(--ink); background: var(--vellum-deep); }
  .tab.active { color: var(--lapis-ink); background: var(--lapis); }
  .tab:focus-visible, button:focus-visible {
    outline: 2px solid var(--lapis);
    outline-offset: 2px;
  }

  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 1.5rem 1rem 5rem;
  }

  /* ---------- hero ---------- */
  .hero {
    text-align: center;
    padding: 2.5rem 0 2rem;
    border-bottom: 1px solid var(--line);
    margin-bottom: 2rem;
  }
  .hero .uncial {
    font-family: "Cardo", Georgia, serif;
    font-size: clamp(1.6rem, 6vw, 2.9rem);
    letter-spacing: 0.14em;
    color: var(--lapis);
    margin: 0 0 0.4rem;
    font-weight: 400;
  }
  .hero .uncial .nomen {
    border-top: 2px solid var(--gold);
    padding-top: 0.05em;
  }
  .hero p.sub {
    max-width: 34rem;
    margin: 0.75rem auto 0;
    color: var(--ink-soft);
    font-size: 0.95rem;
  }
  .hero .translation {
    font-family: "Cardo", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--ink-soft);
    margin: 0;
  }
  .progress-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    margin-top: 1.4rem;
    font-size: 0.8rem;
    color: var(--ink-soft);
  }
  .progress-track {
    width: 180px;
    height: 6px;
    border-radius: 3px;
    background: var(--vellum-deep);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  /* ---------- lesson path ---------- */
  .path { display: flex; flex-direction: column; gap: 0.75rem; }
  .lesson-card {
    display: flex;
    align-items: center;
    gap: 1rem;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1rem 1.1rem;
    cursor: pointer;
    font: inherit;
    color: inherit;
    box-shadow: var(--shadow);
    transition: transform 0.12s ease;
  }
  .lesson-card:hover { transform: translateX(4px); border-color: var(--lapis); }
  .lesson-glyph {
    font-family: "Cardo", Georgia, serif;
    font-size: 1.7rem;
    color: var(--lapis);
    width: 2.6rem;
    height: 2.6rem;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--lapis-wash);
    border-radius: 50%;
  }
  .lesson-card.done .lesson-glyph { background: var(--gold-wash); color: var(--gold); }
  .lesson-meta { min-width: 0; }
  .lesson-meta .kicker {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .lesson-meta h3 { font-size: 1.15rem; font-weight: 700; }
  .lesson-meta p { margin: 0.15rem 0 0; font-size: 0.85rem; color: var(--ink-soft); }
  .lesson-state {
    margin-left: auto;
    flex: none;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--gold);
    white-space: nowrap;
  }

  /* ---------- lesson view ---------- */
  .crumb {
    background: none;
    border: none;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--lapis);
    cursor: pointer;
    padding: 0;
    margin-bottom: 1rem;
  }
  .lesson-head { margin-bottom: 1.5rem; }
  .lesson-head .kicker {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .lesson-head h2 { font-size: 2rem; }
  article.lesson-body { font-size: 1rem; max-width: 42rem; }
  article.lesson-body p { margin: 0 0 1rem; }
  article.lesson-body h3 {
    font-size: 1.3rem;
    margin: 2rem 0 0.75rem;
    padding-bottom: 0.3rem;
    border-bottom: 1px solid var(--line);
  }
  article.lesson-body ul { margin: 0 0 1rem; padding-left: 1.2rem; }
  article.lesson-body li { margin-bottom: 0.35rem; }
  .gk { font-size: 1.12em; }
  .gloss { color: var(--ink-soft); font-style: italic; }

  .callout {
    background: var(--lapis-wash);
    border-left: 3px solid var(--lapis);
    border-radius: 0 8px 8px 0;
    padding: 0.8rem 1rem;
    margin: 1rem 0;
    font-size: 0.92rem;
  }
  .callout strong:first-child { color: var(--lapis); }

  table.paradigm {
    border-collapse: collapse;
    margin: 1rem 0;
    font-size: 0.95rem;
    min-width: 100%;
  }
  .table-scroll { overflow-x: auto; margin: 1rem 0; }
  .table-scroll table.paradigm { margin: 0; }
  table.paradigm th, table.paradigm td {
    padding: 0.45rem 0.9rem;
    text-align: left;
    border-bottom: 1px solid var(--line);
  }
  table.paradigm th {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  table.paradigm td.gk { font-size: 1.15rem; }
  table.paradigm td { font-variant-numeric: tabular-nums; }

  /* ---------- alphabet grid ---------- */
  .letter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
    gap: 0.5rem;
    margin: 1rem 0;
  }
  .letter-cell {
    font-family: "Cardo", Georgia, serif;
    font-size: 1.5rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.5rem 0.25rem;
    cursor: pointer;
    color: var(--ink);
    text-align: center;
    line-height: 1.1;
  }
  .letter-cell small {
    display: block;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.62rem;
    color: var(--ink-soft);
    margin-top: 0.2rem;
    letter-spacing: 0.03em;
  }
  .letter-cell.sel { border-color: var(--lapis); background: var(--lapis-wash); }
  .letter-detail {
    background: var(--surface);
    border: 1px solid var(--lapis);
    border-radius: 10px;
    padding: 1rem 1.2rem;
    margin: 0.75rem 0 1.25rem;
    box-shadow: var(--shadow);
  }
  .letter-detail .big {
    font-family: "Cardo", Georgia, serif;
    font-size: 2.6rem;
    color: var(--lapis);
    line-height: 1;
  }
  .letter-detail dl { margin: 0.6rem 0 0; font-size: 0.9rem; }
  .letter-detail dt { font-weight: 600; display: inline; }
  .letter-detail dd { display: inline; margin: 0 0 0 0.3rem; }
  .letter-detail .row { margin-bottom: 0.25rem; }

  /* ---------- interlinear ---------- */
  .interlinear {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1.25rem 1.25rem 1rem;
    margin: 1rem 0;
    box-shadow: var(--shadow);
  }
  .verse-num {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--gold);
    vertical-align: super;
    margin-right: 0.3rem;
  }
  .il-word {
    display: inline-block;
    font-family: "Cardo", Georgia, serif;
    font-size: 1.35rem;
    background: none;
    border: none;
    border-bottom: 1px dotted var(--line);
    color: var(--ink);
    cursor: pointer;
    padding: 0 0.1rem 0.1rem;
    margin: 0.15rem 0.15rem;
    line-height: 1.3;
  }
  .il-word:hover, .il-word.sel { border-bottom-color: var(--lapis); color: var(--lapis); }
  .il-gloss {
    margin-top: 0.9rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--line);
    font-size: 0.9rem;
    min-height: 2.4rem;
    color: var(--ink-soft);
  }
  .il-gloss .gk { color: var(--lapis); font-size: 1.15rem; }
  .il-gloss b { color: var(--ink); }

  /* ---------- quiz ---------- */
  .quiz {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.4rem;
    margin: 2.5rem 0 1rem;
    box-shadow: var(--shadow);
  }
  .quiz .kicker {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.5rem;
  }
  .quiz h3 { font-size: 1.25rem; margin: 0 0 0.25rem; }
  .quiz .qcount { font-size: 0.8rem; color: var(--ink-soft); margin-bottom: 1rem; }
  .quiz .question {
    font-size: 1.05rem;
    font-weight: 500;
    margin: 0 0 1rem;
  }
  .quiz .question .gk { font-size: 1.5rem; }
  .choices { display: flex; flex-direction: column; gap: 0.5rem; }
  .choice {
    font: inherit;
    font-size: 0.95rem;
    text-align: left;
    background: var(--vellum);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.6rem 0.9rem;
    cursor: pointer;
  }
  .choice .gk { font-size: 1.15rem; }
  .choice:hover:not(:disabled) { border-color: var(--lapis); }
  .choice:disabled { cursor: default; }
  .choice.correct { background: var(--moss-wash); border-color: var(--moss); color: var(--ink); }
  .choice.wrong { background: var(--rubric-wash); border-color: var(--rubric); color: var(--ink); }
  .quiz .feedback { margin-top: 0.9rem; font-size: 0.9rem; min-height: 1.4rem; }
  .quiz .feedback.good { color: var(--moss); font-weight: 500; }
  .quiz .feedback.bad { color: var(--rubric); font-weight: 500; }
  .btn {
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    background: var(--lapis);
    color: var(--lapis-ink);
    border: none;
    border-radius: 999px;
    padding: 0.55rem 1.4rem;
    cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost {
    background: none;
    color: var(--lapis);
    border: 1px solid var(--lapis);
  }
  .quiz-result { text-align: center; padding: 1rem 0 0.5rem; }
  .quiz-result .score {
    font-family: "Cardo", Georgia, serif;
    font-size: 2.4rem;
    color: var(--gold);
  }
  .quiz-actions { display: flex; gap: 0.6rem; justify-content: center; margin-top: 1rem; flex-wrap: wrap; }

  /* ---------- flashcards ---------- */
  .deck-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin: 1rem 0 1.25rem;
  }
  .chip {
    font: inherit;
    font-size: 0.8rem;
    font-weight: 500;
    background: var(--surface);
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.3rem 0.85rem;
    cursor: pointer;
  }
  .chip.active { background: var(--lapis); color: var(--lapis-ink); border-color: var(--lapis); }
  .flashcard {
    width: 100%;
    min-height: 230px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    cursor: pointer;
    padding: 1.5rem;
    text-align: center;
    font: inherit;
    color: inherit;
  }
  .flashcard .word {
    font-family: "Cardo", Georgia, serif;
    font-size: 2.6rem;
    color: var(--lapis);
    line-height: 1.15;
  }
  .flashcard .hint { font-size: 0.78rem; color: var(--ink-soft); }
  .flashcard .answer {
    font-size: 1.25rem;
    font-family: "Cardo", Georgia, serif;
  }
  .flashcard .freq {
    font-size: 0.75rem;
    color: var(--gold);
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .card-actions {
    display: flex;
    gap: 0.6rem;
    justify-content: center;
    margin-top: 1rem;
  }
  .btn.again { background: var(--rubric); color: #fff; }
  .btn.got { background: var(--moss); color: #fff; }
  .deck-stats {
    text-align: center;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-top: 0.9rem;
  }

  /* ---------- reference ---------- */
  .ref-section { margin-bottom: 2.5rem; }
  .ref-section h3 {
    font-size: 1.35rem;
    margin: 0 0 0.75rem;
    padding-bottom: 0.3rem;
    border-bottom: 1px solid var(--line);
  }

  footer.colophon {
    max-width: 780px;
    margin: 0 auto;
    padding: 1.5rem 1rem 3rem;
    border-top: 1px solid var(--line);
    font-size: 0.8rem;
    color: var(--ink-soft);
    text-align: center;
  }

  @media (max-width: 560px) {
    .bar-inner { flex-wrap: wrap; padding-bottom: 0.5rem; }
    nav.tabs { margin-left: 0; width: 100%; justify-content: space-between; }
    .lesson-state { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <button class="wordmark" onclick="go('home')"><span class="gk-mark greek">Ἐν ἀρχῇ</span> · En Archē</button>
    <nav class="tabs">
      <button class="tab" id="tab-home" onclick="go('home')">Path</button>
      <button class="tab" id="tab-cards" onclick="go('cards')">Flashcards</button>
      <button class="tab" id="tab-ref" onclick="go('ref')">Reference</button>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer class="colophon">
  Pronunciation follows the Erasmian classroom convention. Vocabulary frequencies are approximate counts
  of occurrences in the Greek New Testament. Set in Cardo, a typeface made for biblical scholarship.
</footer>

<script>
/* ============================================================
   State & storage
============================================================ */
const store = {
  load() {
    try {
      const raw = localStorage.getItem('enarche-v1');
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { lessons: {}, cards: {} };
  },
  save(state) {
    try { localStorage.setItem('enarche-v1', JSON.stringify(state)); } catch (e) {}
  }
};
let state = store.load();
let view = 'home';
let currentLesson = null;

/* ============================================================
   Data: alphabet
============================================================ */
const ALPHABET = [
  { up:'Α', low:'α', name:'alpha',   tr:'a',  sound:'"a" as in father', note:'' },
  { up:'Β', low:'β', name:'beta',    tr:'b',  sound:'"b" as in ball', note:'' },
  { up:'Γ', low:'γ', name:'gamma',   tr:'g',  sound:'hard "g" as in gift', note:'Before γ, κ, χ, or ξ it is pronounced "n": ἄγγελος = angelos.' },
  { up:'Δ', low:'δ', name:'delta',   tr:'d',  sound:'"d" as in dog', note:'' },
  { up:'Ε', low:'ε', name:'epsilon', tr:'e',  sound:'short "e" as in met', note:'Always short. Contrast with η.' },
  { up:'Ζ', low:'ζ', name:'zeta',    tr:'z',  sound:'"dz" as in adze (or "z")', note:'' },
  { up:'Η', low:'η', name:'eta',     tr:'ē',  sound:'long "e" as in obey', note:'Always long. Looks like an English n — a classic beginner trap.' },
  { up:'Θ', low:'θ', name:'theta',   tr:'th', sound:'"th" as in think', note:'' },
  { up:'Ι', low:'ι', name:'iota',    tr:'i',  sound:'"i" as in sit, or "ee" as in machine', note:'Can be short or long. Never dotted.' },
  { up:'Κ', low:'κ', name:'kappa',   tr:'k',  sound:'"k" as in kite', note:'' },
  { up:'Λ', low:'λ', name:'lambda',  tr:'l',  sound:'"l" as in lamb', note:'' },
  { up:'Μ', low:'μ', name:'mu',      tr:'m',  sound:'"m" as in mother', note:'' },
  { up:'Ν', low:'ν', name:'nu',      tr:'n',  sound:'"n" as in new', note:'Lowercase ν looks like English v — another trap.' },
  { up:'Ξ', low:'ξ', name:'xi',      tr:'x',  sound:'"x" as in axe', note:'' },
  { up:'Ο', low:'ο', name:'omicron', tr:'o',  sound:'short "o" as in not', note:'Always short. Contrast with ω.' },
  { up:'Π', low:'π', name:'pi',      tr:'p',  sound:'"p" as in peach', note:'' },
  { up:'Ρ', low:'ρ', name:'rho',     tr:'r',  sound:'"r" as in rod (lightly rolled)', note:'Lowercase ρ looks like English p.' },
  { up:'Σ', low:'σ / ς', name:'sigma', tr:'s', sound:'"s" as in study', note:'Written σ everywhere except at the end of a word, where it becomes ς: ἀπόστολος.' },
  { up:'Τ', low:'τ', name:'tau',     tr:'t',  sound:'"t" as in talk', note:'' },
  { up:'Υ', low:'υ', name:'upsilon', tr:'u/y',sound:'"u" as in German ü (round your lips)', note:'Transliterated y except in diphthongs (u).' },
  { up:'Φ', low:'φ', name:'phi',     tr:'ph', sound:'"ph" as in phone', note:'' },
  { up:'Χ', low:'χ', name:'chi',     tr:'ch', sound:'"ch" as in Scottish loch / German Bach', note:'Not "ch" as in church.' },
  { up:'Ψ', low:'ψ', name:'psi',     tr:'ps', sound:'"ps" as in lips', note:'' },
  { up:'Ω', low:'ω', name:'omega',   tr:'ō',  sound:'long "o" as in tone', note:'Always long. Contrast with ο.' },
];

/* ============================================================
   Data: flashcards (word, gloss, type, approx NT frequency)
============================================================ */
const CARDS = [
  { w:'ὁ, ἡ, τό', g:'the', t:'small', f:19865 },
  { w:'καί', g:'and, even, also', t:'small', f:9018 },

const app = document.getElementById('app');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function go(v, lessonId) {
  view = v;
  currentLesson = lessonId || null;
  window.scrollTo(0, 0);
  render();
}

function render() {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const tabId = view === 'lesson' ? 'tab-home' : 'tab-' + view;
  const tab = document.getElementById(tabId);
  if (tab) tab.classList.add('active');

  if (view === 'home') renderHome();
  else if (view === 'lesson') renderLesson();
  else if (view === 'cards') renderCards();
  else if (view === 'ref') renderRef();
}

        <span>${pct}%</span>
      </div>
    </div>
    <div class="path">
      ${LESSONS.map((l, i) => {
        const st = state.lessons[l.id];
        const isDone = st && st.done;
        return `
        <button class="lesson-card ${isDone ? 'done' : ''}" onclick="go('lesson','${l.id}')">
          <span class="lesson-glyph greek">${isDone ? '✓' : l.glyph}</span>
          <span class="lesson-meta">
            <span class="kicker">Lesson ${i + 1}</span>
            <h3>${l.title}</h3>
            <p>${l.blurb}</p>
          </span>
          <span class="lesson-state">${isDone ? `Quiz ${st.score}/${st.total}` : ''}</span>
        </button>`;
      }).join('')}
    </div>`;
}

/* ---------- lesson ---------- */
let quiz = null;

function renderLesson() {
  const idx = LESSONS.findIndex(l => l.id === currentLesson);
  const l = LESSONS[idx];
  if (!l) return go('home');
  quiz = { i: 0, score: 0, answered: false, items: l.quiz };
  app.innerHTML = `
    <button class="crumb" onclick="go('home')">← Back to the path</button>
    <div class="lesson-head">
      <span class="kicker">Lesson ${idx + 1} of ${LESSONS.length}</span>
      <h2>${l.title}</h2>
    </div>
    <article class="lesson-body">${l.body()}</article>
    <div class="quiz" id="quiz"></div>`;
  renderQuiz();
}

function renderQuiz() {
  const el = document.getElementById('quiz');
  if (!el || !quiz) return;
  const l = LESSONS.find(x => x.id === currentLesson);
  if (quiz.i >= quiz.items.length) {
    const prev = state.lessons[l.id];
    if (!prev || quiz.score >= (prev.score || 0)) {
      state.lessons[l.id] = { done: true, score: quiz.score, total: quiz.items.length };
      store.save(state);
    } else if (!prev.done) {
      state.lessons[l.id] = { done: true, score: quiz.score, total: quiz.items.length };
      store.save(state);
    }
    const nextIdx = LESSONS.findIndex(x => x.id === l.id) + 1;
    const next = LESSONS[nextIdx];
    el.innerHTML = `
      <div class="kicker">Lesson check</div>
      <div class="quiz-result">
        <div class="score">${quiz.score} / ${quiz.items.length}</div>
        <p>${quiz.score === quiz.items.length ? 'Perfect — the scribes would be proud.'
            : quiz.score >= Math.ceil(quiz.items.length * 0.6) ? 'Solid. Review what you missed and move on.'
            : 'Worth one more pass through the lesson before continuing.'}</p>
        <div class="quiz-actions">
          <button class="btn ghost" onclick="retryQuiz()">Retry quiz</button>
          ${next ? `<button class="btn" onclick="go('lesson','${next.id}')">Next: ${next.title} →</button>`
                 : `<button class="btn" onclick="go('home')">Back to the path</button>`}
        </div>
      </div>`;
    return;
  }
  const q = quiz.items[quiz.i];
  const choices = shuffleDeterministic([q.a, ...q.wrong], quiz.i + quiz.score * 7 + q.a.length);
  el.innerHTML = `
    <div class="kicker">Lesson check</div>
    <div class="qcount">Question ${quiz.i + 1} of ${quiz.items.length}</div>
    <p class="question">${q.q}</p>
    <div class="choices">
      ${choices.map(c => `<button class="choice" data-correct="${c === q.a}" onclick="answer(this)">${c}</button>`).join('')}
    </div>
    <div class="feedback" id="feedback"></div>`;
}

function answer(btn) {
  if (quiz.answered) return;
  quiz.answered = true;
  const correct = btn.dataset.correct === 'true';
  const fb = document.getElementById('feedback');
  document.querySelectorAll('.choice').forEach(c => {
    c.disabled = true;
    if (c.dataset.correct === 'true') c.classList.add('correct');
  });
  if (correct) {
    quiz.score++;
    fb.textContent = 'Correct.';
    fb.className = 'feedback good';
  } else {
    btn.classList.add('wrong');
    fb.textContent = 'Not quite — the highlighted answer is correct.';
    fb.className = 'feedback bad';
  }
  setTimeout(() => { quiz.i++; quiz.answered = false; renderQuiz(); }, correct ? 700 : 1900);
}

function retryQuiz() {
  quiz = { i: 0, score: 0, answered: false, items: LESSONS.find(x => x.id === currentLesson).quiz };
  renderQuiz();
  document.getElementById('quiz').scrollIntoView({ behavior: 'smooth' });
}

function shuffleDeterministic(arr, seed) {
  const a = arr.slice();
  let s = seed * 2654435761 % 4294967296;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 1103515245 + 12345) % 2147483648;
    const j = s % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- alphabet widget ---------- */
function letterGridHTML() {
  return `<div class="letter-grid">
    ${ALPHABET.map((L, i) => `
      <button class="letter-cell greek" id="lc-${i}" onclick="showLetter(${i})">
        ${L.up} ${L.low}<small>${L.name}</small>
      </button>`).join('')}

}
function showLetter(i) {
  const L = ALPHABET[i];
  document.querySelectorAll('.letter-cell').forEach(c => c.classList.remove('sel'));
  const cell = document.getElementById('lc-' + i);
  if (cell) cell.classList.add('sel');
  const d = document.getElementById('letter-detail');
  if (!d) return;
  d.innerHTML = `
    <div class="letter-detail">
      <span class="big greek">${L.up} ${L.low}</span>
      <dl>
        <div class="row"><dt>Name:</dt><dd>${L.name}</dd> &nbsp; <dt>Transliteration:</dt><dd>${L.tr}</dd></div>
        <div class="row"><dt>Sound:</dt><dd>${L.sound}</dd></div>
        ${L.note ? `<div class="row"><dt>Note:</dt><dd>${L.note}</dd></div>` : ''}
      </dl>
    </div>`;
}

/* ---------- interlinear widget ---------- */
function interlinearHTML() {
  return `<div class="interlinear">
    <div>
      ${JOHN.map(v => `<span class="verse-num">${v.v}</span>` +
        v.words.map((w, wi) =>
          `<button class="il-word" onclick="showGloss(${v.v},${wi})">${w[0]}</button>`
        ).join('')).join(' ')}
    </div>
    <div class="il-gloss" id="il-gloss">Tap any Greek word to see its pronunciation and meaning.</div>
  </div>`;
}
function showGloss(v, wi) {
  const verse = JOHN.find(x => x.v === v);
  if (!verse) return;
  const w = verse.words[wi];
  document.querySelectorAll('.il-word').forEach(b => b.classList.remove('sel'));
  const g = document.getElementById('il-gloss');
  if (g) g.innerHTML = `<span class="gk">${w[0].replace(/[,.·]$/,'')}</span> &nbsp;<b>${w[1]}</b> — ${w[2]}`;
}

/* ---------- flashcards ---------- */
let deck = { filter: 'all', order: [], pos: 0, flipped: false };

function buildDeck() {
  const idxs = CARDS.map((c, i) => i).filter(i => deck.filter === 'all' || CARDS[i].t === deck.filter);
  idxs.sort((a, b) => {
    const sa = state.cards[a] || { seen: 0, right: 0 };
    const sb = state.cards[b] || { seen: 0, right: 0 };
    return (sa.right - sa.seen * 0.4) - (sb.right - sb.seen * 0.4) || b - a;
  });
  deck.order = idxs;
  deck.pos = 0;
  deck.flipped = false;
}

function renderCards() {
  if (!deck.order.length) buildDeck();
  const total = CARDS.length;
  const known = Object.values(state.cards).filter(c => c.right >= 2).length;
  const i = deck.order[deck.pos % deck.order.length];
  const c = CARDS[i];
  app.innerHTML = `
    <div class="lesson-head" style="margin-top:0.5rem">
      <span class="kicker">Vocabulary</span>
      <h2>Flashcards</h2>
      <p style="color:var(--ink-soft);font-size:0.9rem;margin:0.4rem 0 0">The 60 words that unlock most of the
      New Testament, ordered so the ones you miss come back first. Tap the card to flip it.</p>
    </div>
    <div class="deck-controls">
      ${[['all','All words'],['small','Small words'],['noun','Nouns'],['verb','Verbs']].map(([k, label]) =>
        `<button class="chip ${deck.filter === k ? 'active' : ''}" onclick="setFilter('${k}')">${label}</button>`).join('')}
    </div>
    <button class="flashcard" onclick="flipCard()" id="fc">
      ${deck.flipped ? `
        <span class="word">${c.w}</span>
        <span class="answer">${c.g}</span>
        <span class="freq">NT ×${c.f.toLocaleString()}</span>
      ` : `
        <span class="word">${c.w}</span>
        <span class="hint">tap to reveal</span>
      `}
    </button>
    <div class="card-actions" style="visibility:${deck.flipped ? 'visible' : 'hidden'}">
      <button class="btn again" onclick="gradeCard(false)">Again</button>
      <button class="btn got" onclick="gradeCard(true)">Got it</button>
    </div>
    <div class="deck-stats">Card ${(deck.pos % deck.order.length) + 1} of ${deck.order.length} in this set
      · ${known} of ${total} words known (answered right twice)</div>`;
}

function setFilter(f) { deck.filter = f; buildDeck(); renderCards(); }
function flipCard() { deck.flipped = !deck.flipped; renderCards(); }
function gradeCard(right) {
  const i = deck.order[deck.pos % deck.order.length];
  const st = state.cards[i] || { seen: 0, right: 0 };
  st.seen++;
  if (right) st.right++;
  state.cards[i] = st;
  store.save(state);
  if (!right) {
    deck.order.splice(Math.min(deck.pos + 4, deck.order.length), 0, i);
  }
  deck.pos++;
  deck.flipped = false;
  renderCards();
}
