<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>En Archē</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --vellum: #F9F6EE;
    --vellum-deep: #F1ECDE;
    --surface: #FFFFFF;
    --ink: #2A2419;
    --ink-soft: #6B6252;
    --line: #DDD5C2;
    --lapis: #33549E;
    --lapis-ink: #FFFFFF;
    --lapis-wash: #E9EDF7;
    --gold: #A9802D;
    --gold-wash: #F5EDDA;
    --rubric: #A63A2B;
    --rubric-wash: #F7E7E3;
    --moss: #4A7A52;
    --moss-wash: #E7F0E8;
    --shadow: 0 1px 3px rgba(42, 36, 25, 0.08), 0 4px 14px rgba(42, 36, 25, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --vellum: #1D1912;
      --vellum-deep: #16130D;
      --surface: #262117;
      --ink: #EAE2CE;
      --ink-soft: #A79B82;
      --line: #3B3427;
      --lapis: #8AA6E8;
      --lapis-ink: #16130D;
      --lapis-wash: #262C3D;
      --gold: #D2A94F;
      --gold-wash: #322A1A;
      --rubric: #D07A65;
      --rubric-wash: #3A241F;
      --moss: #7FAF83;
      --moss-wash: #22301F;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --vellum: #1D1912;
    --vellum-deep: #16130D;
    --surface: #262117;
    --ink: #EAE2CE;
    --ink-soft: #A79B82;
    --line: #3B3427;
    --lapis: #8AA6E8;
    --lapis-ink: #16130D;
    --lapis-wash: #262C3D;
    --gold: #D2A94F;
    --gold-wash: #322A1A;
    --rubric: #D07A65;
    --rubric-wash: #3A241F;
    --moss: #7FAF83;
    --moss-wash: #22301F;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--vellum);
    color: var(--ink);
    font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  .greek, .gk {
    font-family: "Cardo", "Palatino Linotype", "Times New Roman", serif;
  }
  h1, h2, h3 {
    font-family: "Cardo", "Palatino Linotype", Georgia, serif;
    line-height: 1.2;
    text-wrap: balance;
    margin: 0;
  }

  /* ---------- shell ---------- */
  header.bar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--vellum);
    border-bottom: 1px solid var(--line);
  }
  .bar-inner {
    max-width: 780px;
    margin: 0 auto;
    padding: 0.65rem 1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .wordmark {
    font-family: "Cardo", Georgia, serif;
    font-weight: 700;
    font-size: 1.2rem;
    letter-spacing: 0.02em;
    color: var(--ink);
    white-space: nowrap;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
  }
  .wordmark .gk-mark { color: var(--lapis); }
  nav.tabs {
    display: flex;
    gap: 0.25rem;
    margin-left: auto;
  }
  .tab {
    font: inherit;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--ink-soft);
    background: none;
    border: none;
    border-radius: 999px;
    padding: 0.35rem 0.85rem;
    cursor: pointer;
  }
  .tab:hover { color: var(--ink); background: var(--vellum-deep); }
  .tab.active { color: var(--lapis-ink); background: var(--lapis); }
  .tab:focus-visible, button:focus-visible {
    outline: 2px solid var(--lapis);
    outline-offset: 2px;
  }

  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 1.5rem 1rem 5rem;
  }

  /* ---------- hero ---------- */
  .hero {
    text-align: center;
    padding: 2.5rem 0 2rem;
    border-bottom: 1px solid var(--line);
    margin-bottom: 2rem;
  }
  .hero .uncial {
    font-family: "Cardo", Georgia, serif;
    font-size: clamp(1.6rem, 6vw, 2.9rem);
    letter-spacing: 0.14em;
    color: var(--lapis);
    margin: 0 0 0.4rem;
    font-weight: 400;
  }
  .hero .uncial .nomen {
    border-top: 2px solid var(--gold);
    padding-top: 0.05em;
  }
  .hero p.sub {
    max-width: 34rem;
    margin: 0.75rem auto 0;
    color: var(--ink-soft);
    font-size: 0.95rem;
  }
  .hero .translation {
    font-family: "Cardo", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--ink-soft);
    margin: 0;
  }
  .progress-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    margin-top: 1.4rem;
    font-size: 0.8rem;
    color: var(--ink-soft);
  }
  .progress-track {
    width: 180px;
    height: 6px;
    border-radius: 3px;
    background: var(--vellum-deep);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  /* ---------- lesson path ---------- */
  .path { display: flex; flex-direction: column; gap: 0.75rem; }
  .lesson-card {
    display: flex;
    align-items: center;
    gap: 1rem;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1rem 1.1rem;
    cursor: pointer;
    font: inherit;
    color: inherit;
    box-shadow: var(--shadow);
    transition: transform 0.12s ease;
  }
  .lesson-card:hover { transform: translateX(4px); border-color: var(--lapis); }
  .lesson-glyph {
    font-family: "Cardo", Georgia, serif;
    font-size: 1.7rem;
    color: var(--lapis);
    width: 2.6rem;
    height: 2.6rem;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--lapis-wash);
    border-radius: 50%;
  }
  .lesson-card.done .lesson-glyph { background: var(--gold-wash); color: var(--gold); }
  .lesson-meta { min-width: 0; }
  .lesson-meta .kicker {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .lesson-meta h3 { font-size: 1.15rem; font-weight: 700; }
  .lesson-meta p { margin: 0.15rem 0 0; font-size: 0.85rem; color: var(--ink-soft); }
  .lesson-state {
    margin-left: auto;
    flex: none;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--gold);
    white-space: nowrap;
  }

  /* ---------- lesson view ---------- */
  .crumb {
    background: none;
    border: none;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--lapis);
    cursor: pointer;
    padding: 0;
    margin-bottom: 1rem;
  }
  .lesson-head { margin-bottom: 1.5rem; }
  .lesson-head .kicker {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .lesson-head h2 { font-size: 2rem; }
  article.lesson-body { font-size: 1rem; max-width: 42rem; }
  article.lesson-body p { margin: 0 0 1rem; }
  article.lesson-body h3 {
    font-size: 1.3rem;
    margin: 2rem 0 0.75rem;
    padding-bottom: 0.3rem;
    border-bottom: 1px solid var(--line);
  }
  article.lesson-body ul { margin: 0 0 1rem; padding-left: 1.2rem; }
  article.lesson-body li { margin-bottom: 0.35rem; }
  .gk { font-size: 1.12em; }
  .gloss { color: var(--ink-soft); font-style: italic; }

  .callout {
    background: var(--lapis-wash);
    border-left: 3px solid var(--lapis);
    border-radius: 0 8px 8px 0;
    padding: 0.8rem 1rem;
    margin: 1rem 0;
    font-size: 0.92rem;
  }
  .callout strong:first-child { color: var(--lapis); }

  table.paradigm {
    border-collapse: collapse;
    margin: 1rem 0;
    font-size: 0.95rem;
    min-width: 100%;
  }
  .table-scroll { overflow-x: auto; margin: 1rem 0; }
  .table-scroll table.paradigm { margin: 0; }
  table.paradigm th, table.paradigm td {
    padding: 0.45rem 0.9rem;
    text-align: left;
    border-bottom: 1px solid var(--line);
  }
  table.paradigm th {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  table.paradigm td.gk { font-size: 1.15rem; }
  table.paradigm td { font-variant-numeric: tabular-nums; }

  /* ---------- alphabet grid ---------- */
  .letter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
    gap: 0.5rem;
    margin: 1rem 0;
  }
  .letter-cell {
    font-family: "Cardo", Georgia, serif;
    font-size: 1.5rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.5rem 0.25rem;
    cursor: pointer;
    color: var(--ink);
    text-align: center;
    line-height: 1.1;
  }
  .letter-cell small {
    display: block;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.62rem;
    color: var(--ink-soft);
    margin-top: 0.2rem;
    letter-spacing: 0.03em;
  }
  .letter-cell.sel { border-color: var(--lapis); background: var(--lapis-wash); }
  .letter-detail {
    background: var(--surface);
    border: 1px solid var(--lapis);
    border-radius: 10px;
    padding: 1rem 1.2rem;
    margin: 0.75rem 0 1.25rem;
    box-shadow: var(--shadow);
  }
  .letter-detail .big {
    font-family: "Cardo", Georgia, serif;
    font-size: 2.6rem;
    color: var(--lapis);
    line-height: 1;
  }
  .letter-detail dl { margin: 0.6rem 0 0; font-size: 0.9rem; }
  .letter-detail dt { font-weight: 600; display: inline; }
  .letter-detail dd { display: inline; margin: 0 0 0 0.3rem; }
  .letter-detail .row { margin-bottom: 0.25rem; }

  /* ---------- interlinear ---------- */
  .interlinear {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1.25rem 1.25rem 1rem;
    margin: 1rem 0;
    box-shadow: var(--shadow);
  }
  .verse-num {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--gold);
    vertical-align: super;
    margin-right: 0.3rem;
  }
  .il-word {
    display: inline-block;
    font-family: "Cardo", Georgia, serif;
    font-size: 1.35rem;
    background: none;
    border: none;
    border-bottom: 1px dotted var(--line);
    color: var(--ink);
    cursor: pointer;
    padding: 0 0.1rem 0.1rem;
    margin: 0.15rem 0.15rem;
    line-height: 1.3;
  }
  .il-word:hover, .il-word.sel { border-bottom-color: var(--lapis); color: var(--lapis); }
  .il-gloss {
    margin-top: 0.9rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--line);
    font-size: 0.9rem;
    min-height: 2.4rem;
    color: var(--ink-soft);
  }
  .il-gloss .gk { color: var(--lapis); font-size: 1.15rem; }
  .il-gloss b { color: var(--ink); }

  /* ---------- quiz ---------- */
  .quiz {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.4rem;
    margin: 2.5rem 0 1rem;
    box-shadow: var(--shadow);
  }
  .quiz .kicker {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.5rem;
  }
  .quiz h3 { font-size: 1.25rem; margin: 0 0 0.25rem; }
  .quiz .qcount { font-size: 0.8rem; color: var(--ink-soft); margin-bottom: 1rem; }
  .quiz .question {
    font-size: 1.05rem;
    font-weight: 500;
    margin: 0 0 1rem;
  }
  .quiz .question .gk { font-size: 1.5rem; }
  .choices { display: flex; flex-direction: column; gap: 0.5rem; }
  .choice {
    font: inherit;
    font-size: 0.95rem;
    text-align: left;
    background: var(--vellum);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.6rem 0.9rem;
    cursor: pointer;
  }
  .choice .gk { font-size: 1.15rem; }
  .choice:hover:not(:disabled) { border-color: var(--lapis); }
  .choice:disabled { cursor: default; }
  .choice.correct { background: var(--moss-wash); border-color: var(--moss); color: var(--ink); }
  .choice.wrong { background: var(--rubric-wash); border-color: var(--rubric); color: var(--ink); }
  .quiz .feedback { margin-top: 0.9rem; font-size: 0.9rem; min-height: 1.4rem; }
  .quiz .feedback.good { color: var(--moss); font-weight: 500; }
  .quiz .feedback.bad { color: var(--rubric); font-weight: 500; }
  .btn {
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    background: var(--lapis);
    color: var(--lapis-ink);
    border: none;
    border-radius: 999px;
    padding: 0.55rem 1.4rem;
    cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost {
    background: none;
    color: var(--lapis);
    border: 1px solid var(--lapis);
  }
  .quiz-result { text-align: center; padding: 1rem 0 0.5rem; }
  .quiz-result .score {
    font-family: "Cardo", Georgia, serif;
    font-size: 2.4rem;
    color: var(--gold);
  }
  .quiz-actions { display: flex; gap: 0.6rem; justify-content: center; margin-top: 1rem; flex-wrap: wrap; }

  /* ---------- flashcards ---------- */
  .deck-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin: 1rem 0 1.25rem;
  }
  .chip {
    font: inherit;
    font-size: 0.8rem;
    font-weight: 500;
    background: var(--surface);
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.3rem 0.85rem;
    cursor: pointer;
  }
  .chip.active { background: var(--lapis); color: var(--lapis-ink); border-color: var(--lapis); }
  .flashcard {
    width: 100%;
    min-height: 230px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    cursor: pointer;
    padding: 1.5rem;
    text-align: center;
    font: inherit;
    color: inherit;
  }
  .flashcard .word {
    font-family: "Cardo", Georgia, serif;
    font-size: 2.6rem;
    color: var(--lapis);
    line-height: 1.15;
  }
  .flashcard .hint { font-size: 0.78rem; color: var(--ink-soft); }
  .flashcard .answer {
    font-size: 1.25rem;
    font-family: "Cardo", Georgia, serif;
  }
  .flashcard .freq {
    font-size: 0.75rem;
    color: var(--gold);
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .card-actions {
    display: flex;
    gap: 0.6rem;
    justify-content: center;
    margin-top: 1rem;
  }
  .btn.again { background: var(--rubric); color: #fff; }
  .btn.got { background: var(--moss); color: #fff; }
  .deck-stats {
    text-align: center;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-top: 0.9rem;
  }

  /* ---------- reference ---------- */
  .ref-section { margin-bottom: 2.5rem; }
  .ref-section h3 {
    font-size: 1.35rem;
    margin: 0 0 0.75rem;
    padding-bottom: 0.3rem;
    border-bottom: 1px solid var(--line);
  }

  /* ---------- profiles ---------- */
  .profile-chip {
    border: 1px solid var(--line);
    color: var(--gold);
    font-weight: 600;
    max-width: 9rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .profile-list { display: flex; flex-direction: column; gap: 0.6rem; margin: 1.25rem 0; }
  .profile-row {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.85rem 1.1rem;
    box-shadow: var(--shadow);
  }
  .profile-row.active-profile { border-color: var(--gold); }
  .profile-row .pname { font-weight: 600; font-size: 1.05rem; }
  .profile-row .pstats { font-size: 0.8rem; color: var(--ink-soft); }
  .profile-row .spacer { margin-left: auto; }
  .btn.small { font-size: 0.8rem; padding: 0.35rem 0.9rem; }
  .btn.danger { background: none; color: var(--rubric); border: 1px solid var(--rubric); }
  .new-profile { display: flex; gap: 0.6rem; margin-top: 1.25rem; }
  .new-profile input {
    flex: 1;
    font: inherit;
    font-size: 0.95rem;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.5rem 0.85rem;
  }
  .new-profile input:focus-visible { outline: 2px solid var(--lapis); outline-offset: 1px; }

  /* ---------- reading ---------- */
  .passage-card {
    display: flex;
    align-items: center;
    gap: 1rem;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1rem 1.1rem;
    cursor: pointer;
    font: inherit;
    color: inherit;
    box-shadow: var(--shadow);
  }
  .passage-card:hover { border-color: var(--lapis); }
  .passage-card h3 { font-size: 1.1rem; }
  .passage-card .pref { font-size: 0.8rem; color: var(--ink-soft); }
  .passage-card .plevel {
    margin-left: auto;
    flex: none;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--lapis);
    background: var(--lapis-wash);
    border-radius: 999px;
    padding: 0.2rem 0.7rem;
    white-space: nowrap;
  }
  .passage-card.done-reading .plevel { color: var(--gold); background: var(--gold-wash); }
  .mode-toggle { display: flex; gap: 0.4rem; margin: 1rem 0; }
  .verse-block {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1.2rem 1.25rem;
    margin: 1rem 0;
    box-shadow: var(--shadow);
  }
  .verse-block .vgreek {
    font-family: "Cardo", Georgia, serif;
    font-size: 1.45rem;
    line-height: 1.55;
  }
  .verse-block .ven {
    margin-top: 0.9rem;
    padding-top: 0.85rem;
    border-top: 1px solid var(--line);
    font-size: 0.95rem;
  }
  .verse-block .vnote { font-size: 0.85rem; color: var(--ink-soft); margin-top: 0.5rem; }
  .drill-ref { font-size: 0.78rem; color: var(--gold); font-weight: 600; letter-spacing: 0.04em; }

  footer.colophon {
    max-width: 780px;
    margin: 0 auto;
    padding: 1.5rem 1rem 3rem;
    border-top: 1px solid var(--line);
    font-size: 0.8rem;
    color: var(--ink-soft);
    text-align: center;
  }

  @media (max-width: 560px) {
    .bar-inner { flex-wrap: wrap; padding-bottom: 0.5rem; }
    nav.tabs { margin-left: 0; width: 100%; justify-content: space-between; }
    .lesson-state { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <button class="wordmark" onclick="go('home')"><span class="gk-mark greek">Ἐν ἀρχῇ</span> · En Archē</button>
    <nav class="tabs">
      <button class="tab" id="tab-home" onclick="go('home')">Path</button>
      <button class="tab" id="tab-reading" onclick="go('reading')">Reading</button>
      <button class="tab" id="tab-cards" onclick="go('cards')">Flashcards</button>
      <button class="tab" id="tab-ref" onclick="go('ref')">Reference</button>
      <button class="tab profile-chip" id="tab-profiles" onclick="go('profiles')" title="Profiles">—</button>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer class="colophon">
  Pronunciation follows the Erasmian classroom convention. Vocabulary frequencies are approximate counts
  of occurrences in the Greek New Testament. Set in Cardo, a typeface made for biblical scholarship.
</footer>

<script>
/* ============================================================
   State & storage
============================================================ */
function blankProfile() {
  return { lessons: {}, cards: {}, reading: {}, drill: {} };
}
function normalizeProfile(p) {
  return Object.assign(blankProfile(), p || {});
}
const store = {
  load() {
    try {
      const raw = localStorage.getItem('enarche-v2');
      if (raw) {
        const db = JSON.parse(raw);
        if (db && db.profiles && db.profiles[db.active]) {
          Object.keys(db.profiles).forEach(k => { db.profiles[k] = normalizeProfile(db.profiles[k]); });
          return db;
        }
      }
      // migrate v1 (single-user) data into a default profile
      const old = localStorage.getItem('enarche-v1');
      if (old) {
        return { active: 'Student', profiles: { 'Student': normalizeProfile(JSON.parse(old)) } };
      }
    } catch (e) {}
    return { active: 'Student', profiles: { 'Student': blankProfile() } };
  },
  save() {
    try { localStorage.setItem('enarche-v2', JSON.stringify(DB)); } catch (e) {}
  }
};
let DB = store.load();
let state = DB.profiles[DB.active];
let view = 'home';

function switchProfile(name) {
  if (!DB.profiles[name]) return;
  DB.active = name;
  state = DB.profiles[name];
  deck.order = [];
  drill.order = [];
  store.save();
  go('home');
}
function createProfile() {
  const input = document.getElementById('new-profile-name');
  const name = (input && input.value || '').trim().slice(0, 24);
  if (!name) return;
  if (!DB.profiles[name]) {
    DB.profiles[name] = blankProfile();
    store.save();
  }
  switchProfile(name);
}
function deleteProfile(name) {
  if (!DB.profiles[name] || Object.keys(DB.profiles).length <= 1) return;
  if (!confirm(`Delete the profile “${name}” and all its progress? This cannot be undone.`)) return;
  delete DB.profiles[name];
  if (DB.active === name) {
    DB.active = Object.keys(DB.profiles)[0];
    state = DB.profiles[DB.active];
    deck.order = [];
    drill.order = [];
  }
  store.save();
  render();
}

    blurb: 'Why word endings, not word order, carry the meaning.',
    body: () => `
      <p>Here is the single biggest idea in Greek grammar: <strong>the job a noun does in its sentence
      is shown by its ending, not by its position.</strong> English says "God loves the world" and
      "the world loves God" mean different things because of word order. Greek instead changes the
      ends of the words, and can then order them almost freely — for emphasis, rhythm, or art.</p>
      <h3>The four main cases</h3>
      <ul>
        <li><strong>Nominative</strong> — the subject. <em>The <u>word</u> was in the beginning.</em></li>
        <li><strong>Genitive</strong> — possession or source; usually "of." <em>The word <u>of God</u>.</em></li>
        <li><strong>Dative</strong> — indirect object, location, instrument; often "to / for / in / with." <em>He spoke <u>to the crowd</u>.</em></li>
        <li><strong>Accusative</strong> — the direct object. <em>God loved <u>the world</u>.</em></li>
      </ul>
      <p>(A fifth, the <strong>vocative</strong>, is for direct address — <span class="gk">κύριε</span>, "O Lord!" — and is rare enough to learn as you meet it.)</p>
      <h3>Second declension: <span class="gk">ὁ λόγος</span> (the word)</h3>
      <div class="table-scroll"><table class="paradigm">
        <tr><th>Case</th><th>Singular</th><th>Plural</th><th>Signals</th></tr>
        <tr><td>Nominative</td><td class="gk">ὁ λόγος</td><td class="gk">οἱ λόγοι</td><td>subject</td></tr>
        <tr><td>Genitive</td><td class="gk">τοῦ λόγου</td><td class="gk">τῶν λόγων</td><td>"of"</td></tr>
        <tr><td>Dative</td><td class="gk">τῷ λόγῳ</td><td class="gk">τοῖς λόγοις</td><td>"to/for/in"</td></tr>
        <tr><td>Accusative</td><td class="gk">τὸν λόγον</td><td class="gk">τοὺς λόγους</td><td>object</td></tr>
      </table></div>
      <p>Notice the iota subscripts in the dative singular (<span class="gk">τῷ λόγῳ</span>) — this is
      where that silent little iota earns its keep.</p>
      <h3>Neuter second declension: <span class="gk">τὸ ἔργον</span> (the work)</h3>
      <div class="table-scroll"><table class="paradigm">
        <tr><th>Case</th><th>Singular</th><th>Plural</th></tr>
        <tr><td>Nominative</td><td class="gk">τὸ ἔργον</td><td class="gk">τὰ ἔργα</td></tr>
        <tr><td>Genitive</td><td class="gk">τοῦ ἔργου</td><td class="gk">τῶν ἔργων</td></tr>
        <tr><td>Dative</td><td class="gk">τῷ ἔργῳ</td><td class="gk">τοῖς ἔργοις</td></tr>
        <tr><td>Accusative</td><td class="gk">τὸ ἔργον</td><td class="gk">τὰ ἔργα</td></tr>
      </table></div>
      <p>Neuter rule worth memorizing now: <strong>nominative and accusative are always identical</strong> in neuter words.</p>
      <h3>See it work</h3>
      <p><span class="gk">ὁ θεὸς λέγει τὸν λόγον</span> — "God speaks the word."
      <span class="gk">ὁ θεός</span> is nominative (subject); <span class="gk">τὸν λόγον</span> is accusative (object).
      Reorder it — <span class="gk">τὸν λόγον λέγει ὁ θεός</span> — and it still means exactly the same thing,

      thousands of verbs: <span class="gk">λέγω / λέγεις / λέγει…</span> (say),

    blurb: 'I, you, and the many jobs of αὐτός.',
    body: () => `
      <p>Because Greek verb endings already say who acts, pronouns appear mainly for
      <em>emphasis</em> or in cases other than the subject. When Jesus says
      <span class="gk">Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου</span>, the <span class="gk">ἐγώ</span> is not
      needed grammatically — its presence is the emphasis: <em>I</em> am the light.</p>
      <h3>First person: <span class="gk">ἐγώ</span> (I) · <span class="gk">ἡμεῖς</span> (we)</h3>
      <div class="table-scroll"><table class="paradigm">
        <tr><th>Case</th><th>Singular</th><th>Plural</th></tr>
        <tr><td>Nom.</td><td class="gk">ἐγώ</td><td class="gk">ἡμεῖς</td></tr>
        <tr><td>Gen.</td><td class="gk">μου (ἐμοῦ)</td><td class="gk">ἡμῶν</td></tr>
        <tr><td>Dat.</td><td class="gk">μοι (ἐμοί)</td><td class="gk">ἡμῖν</td></tr>
        <tr><td>Acc.</td><td class="gk">με (ἐμέ)</td><td class="gk">ἡμᾶς</td></tr>
      </table></div>
      <h3>Second person: <span class="gk">σύ</span> (you) · <span class="gk">ὑμεῖς</span> (you all)</h3>
      <div class="table-scroll"><table class="paradigm">
        <tr><th>Case</th><th>Singular</th><th>Plural</th></tr>
        <tr><td>Nom.</td><td class="gk">σύ</td><td class="gk">ὑμεῖς</td></tr>
        <tr><td>Gen.</td><td class="gk">σου</td><td class="gk">ὑμῶν</td></tr>
        <tr><td>Dat.</td><td class="gk">σοι</td><td class="gk">ὑμῖν</td></tr>
        <tr><td>Acc.</td><td class="gk">σε</td><td class="gk">ὑμᾶς</td></tr>
      </table></div>
      <p>The longer forms (<span class="gk">ἐμοῦ, ἐμοί, ἐμέ</span>) are the emphatic ones and the ones
      used after prepositions: <span class="gk">δι᾽ ἐμοῦ</span>, "through <em>me</em>."
      The genitive makes possession: <span class="gk">ὁ κύριός μου</span> — "my Lord";
      <span class="gk">τὸ ὄνομά σου</span> — "your name."</p>
      <div class="callout"><strong>Watch the breathing marks.</strong>
      <span class="gk">ἡμεῖς</span> (rough — "we") vs. <span class="gk">ὑμεῖς</span> (also rough — "you all"):
      the real difference is the first letter, η vs. υ. Mixing up "we" and "you" is the classic
      first-year error — sound them out: <em>hēmeis</em> vs. <em>hymeis</em>.</div>
      <h3>The three uses of <span class="gk">αὐτός</span></h3>
      <ul>
        <li><strong>Pronoun</strong> (its usual job, in any case but rarely nominative):
          <span class="gk">λέγει αὐτῷ</span> — "he says <em>to him</em>";
          <span class="gk">ὁ λόγος αὐτοῦ</span> — "<em>his</em> word."</li>
        <li><strong>Intensive</strong> (with a noun, outside the article):
          <span class="gk">αὐτὸς ὁ κύριος</span> — "the Lord <em>himself</em>."</li>
        <li><strong>Identical</strong> (inside the article):
          <span class="gk">ὁ αὐτὸς λόγος</span> — "the <em>same</em> word."</li>
      </ul>
      <p><span class="gk">αὐτός</span> declines exactly like the article-plus-λόγος pattern you know:
      <span class="gk">αὐτός, αὐτοῦ, αὐτῷ, αὐτόν…</span> — you have already met
      <span class="gk">δι᾽ αὐτοῦ</span> and <span class="gk">ἐν αὐτῷ</span> in John 1.</p>`,

    body: () => `
      <p>A Greek adjective agrees with its noun in gender, number, and case — and its endings are
      the article-like endings you already know: <span class="gk">ἀγαθός, ἀγαθή, ἀγαθόν</span>
      (good) declines just like <span class="gk">λόγος / ἀρχή / ἔργον</span>.</p>
      <h3>Position is meaning</h3>
      <p>Where the adjective stands relative to the article decides what the phrase says:</p>
      <ul>
        <li><strong>Attributive</strong> — inside the article's embrace; simply describes:
          <span class="gk">ὁ ἀγαθὸς λόγος</span> or <span class="gk">ὁ λόγος ὁ ἀγαθός</span> —
          "the good word." (The second form, with the article repeated, is the one in
          <span class="gk">ὁ ποιμὴν ὁ καλός</span>, "the good shepherd.")</li>
        <li><strong>Predicate</strong> — outside the article; makes an assertion, with no verb needed:
          <span class="gk">ἀγαθὸς ὁ λόγος</span> or <span class="gk">ὁ λόγος ἀγαθός</span> —
          "the word <em>is</em> good."</li>
        <li><strong>Substantival</strong> — article + adjective, no noun at all:
          <span class="gk">οἱ ἅγιοι</span> — "the holy ones," "the saints";
          <span class="gk">οἱ νεκροί</span> — "the dead."</li>
      </ul>
      <div class="callout"><strong>This matters for reading.</strong> An entire clause like
      <span class="gk">πιστὸς ὁ θεός</span> (1 Cor 1:9) is a complete sentence: "God is faithful."
      No verb in sight — the predicate position <em>is</em> the verb.</div>
      <h3>Core adjectives</h3>
      <div class="table-scroll"><table class="paradigm">
        <tr><th>Greek</th><th>Meaning</th><th>Greek</th><th>Meaning</th></tr>
        <tr><td class="gk">ἀγαθός, -ή, -όν</td><td>good</td><td class="gk">καλός, -ή, -όν</td><td>good, beautiful, noble</td></tr>
        <tr><td class="gk">πιστός, -ή, -όν</td><td>faithful, believing</td><td class="gk">ἅγιος, -α, -ον</td><td>holy</td></tr>
        <tr><td class="gk">νεκρός, -ά, -όν</td><td>dead</td><td class="gk">αἰώνιος, -ον</td><td>eternal</td></tr>
        <tr><td class="gk">ἴδιος, -α, -ον</td><td>one's own</td><td class="gk">ἄλλος, -η, -ο</td><td>other, another</td></tr>
        <tr><td class="gk">ὅλος, -η, -ον</td><td>whole, entire</td><td class="gk">μόνος, -η, -ον</td><td>only, alone</td></tr>
      </table></div>
      <p>Note <span class="gk">αἰώνιος</span>: some adjectives use the same form for masculine and
      feminine — so <span class="gk">ζωὴ αἰώνιος</span>, "eternal life," is correct Greek even though

      <h3>Read these</h3>

        <li><span class="gk">ὁ νόμος ἅγιος.</span> <span class="gloss">The law is holy. (Rom 7:12)</span></li>

    body: () => `
      <p>Greek has two main past tenses, and the difference between them is one of the joys of
      reading the New Testament. The <strong>imperfect</strong> paints the past as
      <em>ongoing, repeated, or continuous</em> — a movie, not a snapshot:
      <span class="gk">ἐδίδασκεν</span>, "he was teaching / he used to teach."</p>
      <h3>The augment</h3>
      <p>Past time is marked by an <strong>augment</strong> on the front of the verb —
      usually the letter <span class="gk">ε</span>: <span class="gk">λύω → ἔλυον</span>.
      If the verb begins with a vowel, the augment lengthens it instead:
      <span class="gk">ἀκούω → ἤκουον</span> (α → η), <span class="gk">ἐγείρω → ἠγειρ-</span>.
      When you see a verb starting with <span class="gk">ἐ-</span> or a long
      <span class="gk">ἠ-</span>, think: <em>past tense</em>.</p>
      <h3>Imperfect active: <span class="gk">ἔλυον</span> (I was loosing)</h3>
      <div class="table-scroll"><table class="paradigm">
        <tr><th>Person</th><th>Singular</th><th>Plural</th></tr>
        <tr><td>1st</td><td class="gk">ἔλυον</td><td class="gk">ἐλύομεν</td></tr>
        <tr><td>2nd</td><td class="gk">ἔλυες</td><td class="gk">ἐλύετε</td></tr>
        <tr><td>3rd</td><td class="gk">ἔλυε(ν)</td><td class="gk">ἔλυον</td></tr>
      </table></div>
      <p>Yes — 1st singular and 3rd plural are identical (<span class="gk">ἔλυον</span>);
      context decides. Note <span class="gk">εἶχον</span>, the irregular imperfect of
      <span class="gk">ἔχω</span> ("I had / they had").</p>
      <h3>Imperfect of <span class="gk">εἰμί</span></h3>
      <div class="table-scroll"><table class="paradigm">
        <tr><th>Person</th><th>Singular</th><th>Plural</th></tr>
        <tr><td>1st</td><td class="gk">ἤμην <span class="gloss">I was</span></td><td class="gk">ἦμεν <span class="gloss">we were</span></td></tr>
        <tr><td>2nd</td><td class="gk">ἦς <span class="gloss">you were</span></td><td class="gk">ἦτε <span class="gloss">you all were</span></td></tr>

      <p>There is <span class="gk">ἦν</span> again — the "was" of John 1:1 is an imperfect:

    body: () => `
      <p>If you learn to read participles, you learn to read the New Testament — no grammatical
      form is more characteristic of Greek style. A participle is a <em>verbal adjective</em>:
      it has tense and voice like a verb, and gender, number, and case like an adjective.</p>
      <h3>Forms to recognize</h3>
      <div class="table-scroll"><table class="paradigm">
        <tr><th>Voice</th><th>Masc.</th><th>Fem.</th><th>Neut.</th><th>Feel</th></tr>
        <tr><td>Active</td><td class="gk">λύων, λύοντος</td><td class="gk">λύουσα</td><td class="gk">λῦον</td><td>loosing</td></tr>
        <tr><td>Middle/passive</td><td class="gk">λυόμενος</td><td class="gk">λυομένη</td><td class="gk">λυόμενον</td><td>being loosed</td></tr>
      </table></div>
      <p>The active declines like a third-declension noun (stem <span class="gk">λυοντ-</span>);
      the middle declines like a familiar first/second-declension adjective. εἰμί's participle
      is <span class="gk">ὤν, οὖσα, ὄν</span> — "being."</p>
      <h3>The two great uses</h3>
      <ul>
        <li><strong>With the article — "the one who ~s":</strong>
          <span class="gk">ὁ πιστεύων</span> — the one believing;
          <span class="gk">ὁ λέγων</span> — the one saying;
          <span class="gk">οἱ ἀκούοντες</span> — those hearing. This is a relative clause folded
          into two words, and the NT uses it constantly.</li>
        <li><strong>Without the article — "while ~ing":</strong> circumstance around the main verb:
          <span class="gk">διδάσκων ἔλεγεν αὐτοῖς</span> — "while teaching, he was saying to them."
          The present participle marks action <em>at the same time</em> as the main verb.</li>
      </ul>
      <div class="callout"><strong>Reading strategy.</strong> When you hit a participle, ask two
      questions: <em>Does it have the article?</em> (→ "the one who…") and
      <em>What does it agree with?</em> Its case points to its noun like a compass needle.</div>
      <h3>Read these</h3>
      <ul>
        <li><span class="gk">ὁ πιστεύων εἰς τὸν υἱὸν ἔχει ζωὴν αἰώνιον.</span> <span class="gloss">The one believing in the Son has eternal life. (John 3:36)</span></li>

      </ul>`,

      { q:'<span class="gk">ὁ πιστεύων</span> means…', a:'the one believing / who believes', wrong:['he believed','believe!','the belief'] },

    body: () => `
      <p>Where the present participle means "while doing," the <strong>aorist participle</strong>
      typically means "<em>having</em> done" — action prior to the main verb. String them together

      <h3>Forms to recognize</h3>

      <p>The subjunctive is the mood of what <em>may</em> or <em>should</em> happen — potential
      rather than fact. The good news: its forms are just the present endings with the connecting
      vowel <em>lengthened</em> (ο→ω, ε→η): <span class="gk">λύωμεν, λύητε, λύῃ, λύωσι</span>.
      εἰμί gives <span class="gk">ὦ, ᾖς, ᾖ, ὦμεν, ἦτε, ὦσι</span>.</p>
      <h3>Where you meet it</h3>
      <ul>
        <li><strong><span class="gk">ἵνα</span> + subjunctive — purpose:</strong>
          <span class="gk">ἵνα πιστεύητε</span> — "in order that you may believe." John states his
          whole book's purpose this way: <span class="gk">ταῦτα γέγραπται ἵνα πιστεύητε</span>,
          "these things stand written so that you may believe" (John 20:31).</li>
        <li><strong><span class="gk">ἐάν</span> + subjunctive — live condition:</strong>
          <span class="gk">ἐὰν ὁμολογῶμεν τὰς ἁμαρτίας ἡμῶν…</span> — "if we confess our sins…"
          (1 John 1:9). Open possibility, not settled fact.</li>
        <li><strong>Hortatory — "let us…":</strong> first plural, self-exhortation:
          <span class="gk">ἀγαπῶμεν ἀλλήλους</span> — "let us love one another." (1 John 4:7)</li>
        <li><strong><span class="gk">οὐ μή</span> + subjunctive — emphatic never:</strong>
          the strongest denial Greek has:
          <span class="gk">οὐ μὴ διψήσει εἰς τὸν αἰῶνα</span> pattern — "shall certainly never…"</li>
      </ul>

      <span class="gk">οὐ</span>; subjunctive (and the other non-indicative moods) take
      <span class="gk">μή</span>. That is why John 3:16 says <span class="gk">μὴ ἀπόληται</span>.

    id: 'imperative', glyph: 'δὸς', title: 'The Imperative',
    blurb: 'Follow me. Do not fear. Let it come.',
    body: () => `
      <p>Commands. Greek has second-person imperatives like English ("go!") — and third-person
      ones English lacks ("let him go!", "let it be done!"), which the Lord's Prayer is built on.</p>
      <h3>Forms</h3>
      <div class="table-scroll"><table class="paradigm">
        <tr><th></th><th>2nd sg</th><th>2nd pl</th><th>3rd sg</th></tr>
        <tr><td>Present</td><td class="gk">λῦε</td><td class="gk">λύετε</td><td class="gk">λυέτω</td></tr>
        <tr><td>Aorist</td><td class="gk">λῦσον</td><td class="gk">λύσατε</td><td class="gk">λυσάτω</td></tr>
      </table></div>
      <p>The <em>tense</em> difference is aspect, not time: present imperative = keep doing /
      general habit (<span class="gk">ἀκολούθει μοι</span>, "follow me" — as a way of life);
      aorist imperative = do it, simply or now (<span class="gk">δὸς ἡμῖν σήμερον</span>,
      "give us today").</p>
      <h3>Prohibitions</h3>
      <ul>
        <li><span class="gk">μή</span> + <strong>present imperative</strong> — stop doing / don't be doing:
          <span class="gk">μὴ φοβοῦ</span> — "do not fear" (φοβέομαι is deponent).</li>
        <li><span class="gk">μή</span> + <strong>aorist subjunctive</strong> — don't (even start):
          <span class="gk">μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν</span> — "do not bring us into testing."</li>
      </ul>

============================================================ */
const app = document.getElementById('app');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function go(v, lessonId) {
  view = v;
  currentLesson = lessonId || null;
  window.scrollTo(0, 0);
  render();
}

function render() {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const tabId = view === 'lesson' ? 'tab-home' : view === 'passage' ? 'tab-reading' : 'tab-' + view;
  const tab = document.getElementById(tabId);
  if (tab) tab.classList.add('active');
  const chip = document.getElementById('tab-profiles');
  if (chip) chip.textContent = DB.active;

  if (view === 'home') renderHome();
  else if (view === 'lesson') renderLesson();
  else if (view === 'reading') renderReading();
  else if (view === 'passage') renderPassage();
  else if (view === 'cards') renderCards();
  else if (view === 'ref') renderRef();
  else if (view === 'profiles') renderProfiles();
}

/* ---------- home ---------- */
function renderHome() {
  const done = LESSONS.filter(l => state.lessons[l.id] && state.lessons[l.id].done).length;
  const pct = Math.round(done / LESSONS.length * 100);
  app.innerHTML = `
    <div class="hero">
      <p class="uncial greek">ΕΝ ΑΡΧΗ ΗΝ Ο <span class="nomen">ΛΟΓΟΣ</span></p>
      <p class="translation">"In the beginning was the Word" — John 1:1</p>
      <p class="sub">A first course in Biblical Greek: from the alphabet through the full verb
      system, reading real scripture at every step — John's prologue, the "I AM" sayings,
      John 3:16, the Lord's Prayer, and 1 John, in the original.</p>
      <div class="progress-line">
        <span>${done} of ${LESSONS.length} lessons</span>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <span>${pct}%</span>
      </div>
    </div>
    <div class="path">
      ${LESSONS.map((l, i) => {
        const st = state.lessons[l.id];
        const isDone = st && st.done;
        return `
        <button class="lesson-card ${isDone ? 'done' : ''}" onclick="go('lesson','${l.id}')">
          <span class="lesson-glyph greek">${isDone ? '✓' : l.glyph}</span>
          <span class="lesson-meta">
            <span class="kicker">Lesson ${i + 1}</span>
            <h3>${l.title}</h3>

/* ---------- lesson ---------- */
let quiz = null;

function renderLesson() {
  const idx = LESSONS.findIndex(l => l.id === currentLesson);
  const l = LESSONS[idx];
  if (!l) return go('home');
  quiz = { i: 0, score: 0, answered: false, items: l.quiz };
  app.innerHTML = `
    <button class="crumb" onclick="go('home')">← Back to the path</button>
    <div class="lesson-head">
      <span class="kicker">Lesson ${idx + 1} of ${LESSONS.length}</span>
      <h2>${l.title}</h2>
    </div>
    <article class="lesson-body">${l.body()}</article>
    <div class="quiz" id="quiz"></div>`;
  renderQuiz();
}

function renderQuiz() {
  const el = document.getElementById('quiz');
  if (!el || !quiz) return;
  const l = LESSONS.find(x => x.id === currentLesson);
  if (quiz.i >= quiz.items.length) {
    const prev = state.lessons[l.id];
    if (!prev || quiz.score >= (prev.score || 0)) {
      state.lessons[l.id] = { done: true, score: quiz.score, total: quiz.items.length };
      store.save(state);
    } else if (!prev.done) {
      state.lessons[l.id] = { done: true, score: quiz.score, total: quiz.items.length };
      store.save(state);
    }
    const nextIdx = LESSONS.findIndex(x => x.id === l.id) + 1;
    const next = LESSONS[nextIdx];
    el.innerHTML = `
      <div class="kicker">Lesson check</div>
      <div class="quiz-result">
        <div class="score">${quiz.score} / ${quiz.items.length}</div>
        <p>${quiz.score === quiz.items.length ? 'Perfect — the scribes would be proud.'
            : quiz.score >= Math.ceil(quiz.items.length * 0.6) ? 'Solid. Review what you missed and move on.'
            : 'Worth one more pass through the lesson before continuing.'}</p>
        <div class="quiz-actions">
          <button class="btn ghost" onclick="retryQuiz()">Retry quiz</button>
          ${next ? `<button class="btn" onclick="go('lesson','${next.id}')">Next: ${next.title} →</button>`
                 : `<button class="btn" onclick="go('home')">Back to the path</button>`}
        </div>
      </div>`;
    return;
  }
  const q = quiz.items[quiz.i];
  const choices = shuffleDeterministic([q.a, ...q.wrong], quiz.i + quiz.score * 7 + q.a.length);
  el.innerHTML = `
    <div class="kicker">Lesson check</div>
    <div class="qcount">Question ${quiz.i + 1} of ${quiz.items.length}</div>
    <p class="question">${q.q}</p>
    <div class="choices">
      ${choices.map(c => `<button class="choice" data-correct="${c === q.a}" onclick="answer(this)">${c}</button>`).join('')}
    </div>
    <div class="feedback" id="feedback"></div>`;
}

function answer(btn) {
  if (quiz.answered) return;
  quiz.answered = true;
  const correct = btn.dataset.correct === 'true';
  const fb = document.getElementById('feedback');
  document.querySelectorAll('.choice').forEach(c => {
    c.disabled = true;
    if (c.dataset.correct === 'true') c.classList.add('correct');
  });
  if (correct) {
    quiz.score++;
    fb.textContent = 'Correct.';
    fb.className = 'feedback good';
  } else {
    btn.classList.add('wrong');
    fb.textContent = 'Not quite — the highlighted answer is correct.';
    fb.className = 'feedback bad';
  }
  setTimeout(() => { quiz.i++; quiz.answered = false; renderQuiz(); }, correct ? 700 : 1900);
}

function retryQuiz() {
  quiz = { i: 0, score: 0, answered: false, items: LESSONS.find(x => x.id === currentLesson).quiz };
  renderQuiz();
  document.getElementById('quiz').scrollIntoView({ behavior: 'smooth' });
}

function shuffleDeterministic(arr, seed) {
  const a = arr.slice();
  let s = seed * 2654435761 % 4294967296;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 1103515245 + 12345) % 2147483648;
    const j = s % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- alphabet widget ---------- */
function letterGridHTML() {
  return `<div class="letter-grid">
    ${ALPHABET.map((L, i) => `
      <button class="letter-cell greek" id="lc-${i}" onclick="showLetter(${i})">
        ${L.up} ${L.low}<small>${L.name}</small>

}
function showLetter(i) {
  const L = ALPHABET[i];
  document.querySelectorAll('.letter-cell').forEach(c => c.classList.remove('sel'));

  if (cell) cell.classList.add('sel');

  d.innerHTML = `
    <div class="letter-detail">
      <span class="big greek">${L.up} ${L.low}</span>
      <dl>
        <div class="row"><dt>Name:</dt><dd>${L.name}</dd> &nbsp; <dt>Transliteration:</dt><dd>${L.tr}</dd></div>
        <div class="row"><dt>Sound:</dt><dd>${L.sound}</dd></div>
        ${L.note ? `<div class="row"><dt>Note:</dt><dd>${L.note}</dd></div>` : ''}
      </dl>
    </div>`;
}

/* ---------- interlinear widget ---------- */
function interlinearHTML(pid) {
  const p = PASSAGES[pid];
  return `<div class="interlinear">
    <div>
      ${p.verses.map((v, vi) => `<span class="verse-num">${v.ref || v.v}</span>` +
        v.words.map((w, wi) =>
          `<button class="il-word" onclick="showGloss('${pid}',${vi},${wi})">${w[0]}</button>`
        ).join('')).join(' ')}
    </div>
    <div class="il-gloss" id="il-gloss">Tap any Greek word to see its pronunciation and meaning.</div>
  </div>`;
}
function showGloss(pid, vi, wi) {
  const verse = PASSAGES[pid] && PASSAGES[pid].verses[vi];
  if (!verse) return;
  const w = verse.words[wi];
  document.querySelectorAll('.il-word').forEach(b => b.classList.remove('sel'));
  const g = document.getElementById('il-gloss');
  if (g) g.innerHTML = `<span class="gk">${w[0].replace(/[,.·]$/,'')}</span> &nbsp;<b>${w[1]}</b> — ${w[2]}`;
}

/* ---------- flashcards ---------- */
let deck = { filter: 'all', order: [], pos: 0, flipped: false };

function buildDeck() {
  const idxs = CARDS.map((c, i) => i).filter(i => deck.filter === 'all' || CARDS[i].t === deck.filter);
  idxs.sort((a, b) => {
    const sa = state.cards[a] || { seen: 0, right: 0 };
    const sb = state.cards[b] || { seen: 0, right: 0 };
    return (sa.right - sa.seen * 0.4) - (sb.right - sb.seen * 0.4) || b - a;
  });
  deck.order = idxs;
  deck.pos = 0;
  deck.flipped = false;
}

function renderCards() {
  if (!deck.order.length) buildDeck();
  const total = CARDS.length;
  const known = Object.values(state.cards).filter(c => c.right >= 2).length;
  const i = deck.order[deck.pos % deck.order.length];
  const c = CARDS[i];
  app.innerHTML = `
    <div class="lesson-head" style="margin-top:0.5rem">
      <span class="kicker">Vocabulary</span>
      <h2>Flashcards</h2>
      <p style="color:var(--ink-soft);font-size:0.9rem;margin:0.4rem 0 0">${CARDS.length} high-frequency words
      that unlock most of the New Testament, ordered so the ones you miss come back first. Tap the card to flip it.</p>
    </div>
    <div class="deck-controls">
      ${[['all','All words'],['small','Small words'],['noun','Nouns'],['verb','Verbs']].map(([k, label]) =>
        `<button class="chip ${deck.filter === k ? 'active' : ''}" onclick="setFilter('${k}')">${label}</button>`).join('')}
    </div>
    <button class="flashcard" onclick="flipCard()" id="fc">
      ${deck.flipped ? `
        <span class="word">${c.w}</span>
        <span class="answer">${c.g}</span>
        <span class="freq">NT ×${c.f.toLocaleString()}</span>
      ` : `
        <span class="word">${c.w}</span>
        <span class="hint">tap to reveal</span>
      `}
    </button>
    <div class="card-actions" style="visibility:${deck.flipped ? 'visible' : 'hidden'}">
      <button class="btn again" onclick="gradeCard(false)">Again</button>
      <button class="btn got" onclick="gradeCard(true)">Got it</button>
    </div>
    <div class="deck-stats">Card ${(deck.pos % deck.order.length) + 1} of ${deck.order.length} in this set
      · ${known} of ${total} words known (answered right twice)</div>`;
}

function setFilter(f) { deck.filter = f; buildDeck(); renderCards(); }
function flipCard() { deck.flipped = !deck.flipped; renderCards(); }
function gradeCard(right) {
  const i = deck.order[deck.pos % deck.order.length];
  const st = state.cards[i] || { seen: 0, right: 0 };
  st.seen++;
  if (right) st.right++;
  state.cards[i] = st;
  store.save(state);
  if (!right) {
    deck.order.splice(Math.min(deck.pos + 4, deck.order.length), 0, i);
  }
  deck.pos++;
  deck.flipped = false;
  renderCards();
}

/* ---------- reading ---------- */
let currentPassage = null;
let rd = { mode: 'read', vi: 0, score: 0, revealed: false };
let drill = { tier: 'all', order: [], pos: 0, revealed: false };

function renderReading() {
  const drillKnown = Object.values(state.drill).filter(d => d.right >= 2).length;
  app.innerHTML = `
    <div class="lesson-head" style="margin-top:0.5rem">
      <span class="kicker">Real texts</span>
      <h2>Reading</h2>
      <p style="color:var(--ink-soft);font-size:0.9rem;margin:0.4rem 0 0">Guided passages with
      word-by-word glosses and a translate-it-yourself mode, plus a drill of short famous verses.
      The level tags suggest when each text opens up — but nothing is locked.</p>
    </div>
    <div class="path" style="margin-top:1.25rem">
      ${Object.keys(PASSAGES).map(pid => {
        const p = PASSAGES[pid];
        const st = state.reading[pid];
        const done = st && st.best === p.verses.length;
        return `
        <button class="passage-card ${done ? 'done-reading' : ''}" onclick="openPassage('${pid}')">
          <span class="lesson-meta">
            <h3>${p.title}</h3>
            <p class="pref">${p.ref}${st ? ` · best translation pass: ${st.best}/${p.verses.length}` : ''}</p>
          </span>
          <span class="plevel">${done ? '✓ Translated' : p.level}</span>
        </button>`;
      }).join('')}
    </div>
    <div class="lesson-head" style="margin-top:2.5rem">
      <span class="kicker">Verse drill</span>
      <h2 style="font-size:1.5rem">Famous verses, one line at a time</h2>
      <p style="color:var(--ink-soft);font-size:0.9rem;margin:0.4rem 0 0">Read the Greek aloud,
      translate it in your head, then reveal. Verses you miss come back first.
      ${drillKnown} of ${SENTENCES.length} known (right twice).</p>
    </div>
    <div class="deck-controls">
      ${[['all','All'],['1','Tier 1 · after Lesson 8'],['2','Tier 2 · after Lesson 16'],['3','Tier 3 · after Lesson 25']].map(([k, label]) =>
        `<button class="chip ${drill.tier === k ? 'active' : ''}" onclick="setDrillTier('${k}')">${label}</button>`).join('')}
    </div>
    ${drillCardHTML()}`;
}

function buildDrill() {
  const idxs = SENTENCES.map((s, i) => i).filter(i => drill.tier === 'all' || SENTENCES[i].tier === Number(drill.tier));
  idxs.sort((a, b) => {
    const sa = state.drill[a] || { seen: 0, right: 0 };
    const sb = state.drill[b] || { seen: 0, right: 0 };
    return (sa.right - sa.seen * 0.4) - (sb.right - sb.seen * 0.4) || a - b;
  });
  drill.order = idxs;
  drill.pos = 0;
  drill.revealed = false;
}

function drillCardHTML() {
  if (!drill.order.length) buildDrill();
  if (!drill.order.length) return '<p style="color:var(--ink-soft)">No verses in this tier.</p>';
  const i = drill.order[drill.pos % drill.order.length];
  const s = SENTENCES[i];
  return `
    <button class="flashcard" onclick="revealDrill()" id="drill-card">
      <span class="drill-ref">${s.ref}</span>
      <span class="word" style="font-size:1.7rem">${s.gk}</span>
      ${drill.revealed ? `
        <span class="answer">${s.en}</span>
        ${s.note ? `<span class="hint" style="max-width:34rem">${s.note}</span>` : ''}
      ` : `<span class="hint">translate it in your head, then tap to reveal</span>`}
    </button>
    <div class="card-actions" style="visibility:${drill.revealed ? 'visible' : 'hidden'}">
      <button class="btn again" onclick="gradeDrill(false)">Again</button>
      <button class="btn got" onclick="gradeDrill(true)">Got it</button>
    </div>
    <div class="deck-stats">Verse ${(drill.pos % drill.order.length) + 1} of ${drill.order.length} in this tier</div>`;
}

function setDrillTier(t) { drill.tier = t; buildDrill(); renderReading(); }
function revealDrill() { drill.revealed = !drill.revealed; renderReading(); }
function gradeDrill(right) {
  const i = drill.order[drill.pos % drill.order.length];
  const st = state.drill[i] || { seen: 0, right: 0 };
  st.seen++;
  if (right) st.right++;
  state.drill[i] = st;
  store.save();
  if (!right) drill.order.splice(Math.min(drill.pos + 3, drill.order.length), 0, i);
  drill.pos++;
  drill.revealed = false;
  renderReading();
}

function openPassage(pid) {
  currentPassage = pid;
  rd = { mode: 'read', vi: 0, score: 0, revealed: false };
  go('passage');
}

function setPassageMode(m) {
  rd.mode = m;
  rd.vi = 0; rd.score = 0; rd.revealed = false;
  renderPassage();
}

function renderPassage() {
  const p = PASSAGES[currentPassage];
  if (!p) return go('reading');
  app.innerHTML = `
    <button class="crumb" onclick="go('reading')">← Back to reading</button>
    <div class="lesson-head">
      <span class="kicker">${p.ref}</span>
      <h2>${p.title}</h2>
    </div>
    <div class="mode-toggle">
      <button class="chip ${rd.mode === 'read' ? 'active' : ''}" onclick="setPassageMode('read')">Read with glosses</button>
      <button class="chip ${rd.mode === 'translate' ? 'active' : ''}" onclick="setPassageMode('translate')">Translate it yourself</button>
    </div>
    <div id="passage-body">${rd.mode === 'read' ? interlinearHTML(currentPassage) : translateHTML(p)}</div>`;
}

function translateHTML(p) {
  if (rd.vi >= p.verses.length) {
    const st = state.reading[currentPassage] || { best: 0 };
    if (rd.score > st.best) {
      state.reading[currentPassage] = { best: rd.score, total: p.verses.length };
      store.save();
    }
    const best = Math.max(rd.score, st.best);
    return `
      <div class="quiz"><div class="quiz-result">
        <div class="score">${rd.score} / ${p.verses.length}</div>
        <p>${rd.score === p.verses.length ? 'Every verse — you are reading scripture unaided.'
            : 'Best pass so far: ' + best + ' of ' + p.verses.length + '. The glossed reading is always there to review.'}</p>
        <div class="quiz-actions">
          <button class="btn ghost" onclick="setPassageMode('translate')">Translate again</button>
          <button class="btn" onclick="setPassageMode('read')">Reread with glosses</button>
        </div>
      </div></div>`;
  }
  const v = p.verses[rd.vi];
  return `
    <div class="verse-block">
      <div style="font-size:0.8rem;color:var(--ink-soft);margin-bottom:0.6rem">
        Verse ${rd.vi + 1} of ${p.verses.length} · ${v.ref || v.v}</div>
      <div class="vgreek greek">${v.words.map(w => w[0]).join(' ')}</div>
      ${rd.revealed ? `
        <div class="ven">${v.en}</div>
        <div class="vnote">How close were you? Grade yourself honestly — misses return sooner next pass.</div>
        <div class="card-actions" style="justify-content:flex-start">
          <button class="btn again" onclick="gradeVerse(false)">Missed it</button>
          <button class="btn got" onclick="gradeVerse(true)">Got it</button>
        </div>
      ` : `
        <div class="vnote">Translate aloud or on paper, then check.</div>
        <div class="card-actions" style="justify-content:flex-start">
          <button class="btn" onclick="rd.revealed = true; renderPassage()">Show translation</button>
        </div>
      `}
    </div>`;
}

function gradeVerse(right) {
  if (right) rd.score++;
  rd.vi++;
  rd.revealed = false;
  renderPassage();
}

/* ---------- profiles ---------- */
function renderProfiles() {
  const names = Object.keys(DB.profiles);
  app.innerHTML = `
    <div class="lesson-head" style="margin-top:0.5rem">
      <span class="kicker">Who is studying?</span>
      <h2>Profiles</h2>
      <p style="color:var(--ink-soft);font-size:0.9rem;margin:0.4rem 0 0">Each profile keeps its own
      lesson progress, quiz scores, flashcards, and reading stats — several people can share this
      page. Progress lives in this browser only.</p>
    </div>
    <div class="profile-list">
      ${names.map(n => {
        const p = DB.profiles[n];
        const done = LESSONS.filter(l => p.lessons[l.id] && p.lessons[l.id].done).length;
        const words = Object.values(p.cards).filter(c => c.right >= 2).length;
        const safe = n.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        return `
        <div class="profile-row ${n === DB.active ? 'active-profile' : ''}">
          <span>
            <div class="pname">${n}${n === DB.active ? ' · studying now' : ''}</div>
            <div class="pstats">${done} of ${LESSONS.length} lessons · ${words} words known</div>
          </span>
          <span class="spacer"></span>
          ${n === DB.active ? '' : `<button class="btn small" onclick="switchProfile('${safe}')">Switch</button>`}
          ${names.length > 1 ? `<button class="btn small danger" onclick="deleteProfile('${safe}')">Delete</button>` : ''}
        </div>`;
      }).join('')}
    </div>
    <div class="new-profile">
      <input id="new-profile-name" maxlength="24" placeholder="New profile name"
        onkeydown="if(event.key==='Enter')createProfile()">
      <button class="btn" onclick="createProfile()">Add profile</button>
    </div>`;
}

        <tr><td class="gk">ἐπί</td><td>gen., dat., acc.</td><td>on, upon, over</td></tr>

    </div>`;
}
